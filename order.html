<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>SOURLOVE — Order</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="page-container">
    <div id="site-header"></div>

    <main>
      <section class="section">
        <div class="section-header">
          <h2>Place an order request</h2>
          <p>Your order is confirmed only once SOURLOVE accepts it.</p>
        </div>

        <div class="card">
          <p style="font-size:0.9rem;color:#7a6a5f;">
            Start with a simple order request form. Payments and automated confirmations can be added later if needed.
          </p>

          <!-- This form is static; you can later connect it to email or a backend if desired -->
          <form>
            <div>
              <label for="name">Name</label>
              <input id="name" type="text" name="name" required>
            </div>
            <div>
              <label for="email">Email</label>
              <input id="email" type="email" name="email" required>
            </div>
            <div>
              <label for="products">Products and quantities</label>
              <textarea id="products" name="products" placeholder="e.g. 1x Classic Sourdough, 2x Portuguese Chorizo Bun"
                required></textarea>
            </div>
            <div>
              <label for="collection">Collection point</label>
              <select id="collection" name="collection" required>
                <option value="">Select a collection point</option>
                <option value="waterlooville-market">Waterlooville Precinct Market</option>
                <option value="bake-shed">Bake Shed, Waterlooville</option>
                <option value="other-market">Other confirmed market</option>
              </select>
            </div>
            <div>
              <label for="date">Preferred collection date</label>
              <input id="date" type="text" name="date" placeholder="e.g. Saturday 12 October">
            </div>
            <div>
              <label for="notes">Notes</label>
              <textarea id="notes" name="notes" placeholder="Allergies, special requests, or questions"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Submit order request</button>
          </form>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
  </div>
  <script src="js/layout.js"></script>
</body>

</html>
